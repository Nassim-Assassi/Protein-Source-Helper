name: Deploy static summary pages

on:
  push:
    branches:
      - main
    paths:
      - 'static_summary_pages/**'
      - '.github/workflows/static_summary_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: static_summary_pages/requirements.txt

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r static_summary_pages/requirements.txt

      - name: Generate dashboard data
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: python static_summary_pages/summary_pages_generator.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static summary pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: static_summary_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
