name: SQL Linter Workflow
on:
  push:
    branches:
      - main
    paths:
      - '**/*.sql'
      - '.github/workflows/sql_linter.yml'
  pull_request:
    paths:
      - '**/*.sql'
      - '.github/workflows/sql_linter.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run SQLFluff Linter
        run: |
          python -m pip install sqlfluff
          sqlfluff lint --dialect postgres database/*.sql
  





