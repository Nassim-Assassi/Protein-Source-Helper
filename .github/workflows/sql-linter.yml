name: SQL Linter Workflow
on:
  push:
    branches:
      - main
    paths:
      - '**/*.sql'
  pull_request:
    paths:
      - '**/*.sql'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Squawk Linter
        uses: mshick/squawk-action@v1
        with:
          files: 'database/*.sql'

      - name: Run SQLFluff Linter
        uses: sqlfluff/sqlfluff-action@v1
        with:
          files: 'database/*.sql'

  

  


