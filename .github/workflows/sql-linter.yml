name: SQL Linter Workflow
on:
  push:
    branches:
      - main
    paths:
      - '**/*.sql'
  pull_request:
    paths:
      - '**/*.sql'
  workflow_dispatch:
  
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Squawk Linter
        uses: sbdchd/squawk-action@v2
        with:
          pattern: 'database/*.sql'
          fail-on-violations: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run SQLFluff Linter
        run: |
          python -m pip install sqlfluff
          sqlfluff lint --dialect postgres database/*.sql
  





